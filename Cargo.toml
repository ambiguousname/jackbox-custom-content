[package]
name = "custom-box"
version = "2.0.0-alpha.0"
description = "Content creation for the Jackbox Party Pack 7. \n With much gratitude to Jackbox Games and the developers of the Jackbox Party Pack 7. \n Made with Rust 2021, GTK 4.12 (gtk-rs 0.8.2), Serde 1.0, and open 5.0.1"
edition = "2021"
build = "src/build/build.rs"
readme = "README"
license-file="LICENSE"
publish=false
homepage="https://github.com/ambiguousname/jackbox-custom-content"
authors=["ambiguousname"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
open = "5.3"
regex = "1.11"

[dependencies.gtk]
package = "gtk4"
version = "0.9.5"
features = ["v4_12"]

[build-dependencies]
glib-build-tools = "0.20.0"
serde-xml-rs="0.6.0"
serde= {version="1.0", features = ["derive"]}
regex = "1.10.3"
